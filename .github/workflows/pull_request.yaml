# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read


jobs:
  lint_test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
        os: [ubuntu-latest, windows-2022, macos-latest]
    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: ${{ runner.os == 'Windows' && '' || 'yarn' }}
    - name: Disable Windows Defender realtime monitoring
      if: runner.os == 'Windows'
      run: Set-MpPreference -DisableRealtimeMonitoring $true
      shell: powershell
    - name: Cache node_modules (Windows)
      if: runner.os == 'Windows'
      uses: actions/cache@v4
      with:
        path: node_modules
        key: win-node-modules-${{ matrix.node-version }}-${{ hashFiles('yarn.lock') }}
        restore-keys: |
          win-node-modules-${{ matrix.node-version }}-
    - run: yarn install
    - run: yarn run lint
    - run: yarn run build
    - name: Run ShapeScript parser tests
      run: yarn run test:shapescript
    - name: Run wave script parser test
      run: yarn run test:wave
    - name: Update version with timestamp
      run: |
        TIMESTAMP=$(date +%Y%m%d%H%M%S)
        VERSION=$(node -p "require('./package.json').version")
        NEW_VERSION="${VERSION}-${TIMESTAMP}"
        npm version $NEW_VERSION --no-git-tag-version
    - run: npm pack
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: npm-package-${{ matrix.os }}-${{ matrix.node-version }}
        path: "*.tgz"
